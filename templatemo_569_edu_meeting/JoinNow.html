  <style>

    /* ---------------- NAV + SEARCH BOX ---------------- */

    .site-search-box {
      display: none;
      position: absolute;
      top: 100px;
      right: 0;
      margin-top: 8px;
      width: 340px;
      background: rgba(15, 15, 15, 0.98);
      border: 1px solid rgba(212, 160, 23, 0.5);
      border-radius: 0 0 14px 14px;
      padding: 14px;
      z-index: 9999;
      box-shadow: 0 10px 25px rgba(0,0,0,0.35);
      animation: dropdownFade 0.25s ease;
    }

    .site-search-box input {
      width: 100%;
      padding: 12px 14px;
      border: 1px solid rgba(212, 160, 23, 0.4);
      border-radius: 8px;
      background: #1a1a1a;
      color: white;
      font-size: 14px;
      outline: none;
    }

    .site-search-box input::placeholder {
      color: #aaa;
    }

    .site-search-box input:focus {
      border-color: #d4a017;
      box-shadow: 0 0 0 3px rgba(212,160,23,0.15);
    }

    #searchResults {
      margin-top: 10px;
      max-height: 220px;
      overflow-y: auto;
    }

    #searchResults a {
      display: block;
      padding: 10px 12px;
      border-radius: 8px;
      color: white;
      text-decoration: none;
      font-weight: 500;
      transition: 0.2s ease;
    }

    #searchResults a:hover {
      background: rgba(212,160,23,0.15);
      color: #d4a017;
    }

    @keyframes dropdownFade {
      from { opacity: 0; transform: translateY(-8px); }
      to { opacity: 1; transform: translateY(0); }
    }

    /* ---------------- ORIGINAL PAGE STYLES ---------------- */

    body {
      margin: 0;
      padding: 0;
      min-height: 100vh;
      text-align: center;

      background:
        linear-gradient(rgba(0,0,0,0.82), rgba(0,0,0,0.92)),
        url("assets/images/scholarshipbackground.jpeg")
        center center / cover no-repeat;

      font-family: Poppins, sans-serif;
      color: white;
    }

    .construction-text {
      margin-top: 180px; /* pushes content below navbar */
    }

    .construction-text h1 {
      color: white;
      font-size: 70px;
      font-weight: 900;
      margin-bottom: 20px;
    }

    .construction-text h1 span {
      color: #d4a017;
    }

    .construction-text p {
      color: #e7e7e7;
      font-size: 20px;
      line-height: 1.8;
      max-width: 700px;
      margin: auto;
    }

    @media (max-width: 768px) {
      .construction-text h1 {
        font-size: 42px;
      }

      .construction-text p {
        font-size: 17px;
        padding: 0 20px;
      }
    }

  </style>
