<!DOCTYPE html>
<html lang="en">

<head>

  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Under Construction</title>

<style>

body {
  margin: 0;
  padding: 0;

  height: 100vh;

  display: flex;
  justify-content: center;
  align-items: center;

  text-align: center;

  background:
    linear-gradient(rgba(0,0,0,0.82), rgba(0,0,0,0.92)),
    url("assets/images/scholarshipbackground.jpeg")
    center center / cover no-repeat;

  font-family: Poppins, sans-serif;
}

.construction-text h1 {
  color: white;
  font-size: 70px;
  font-weight: 900;
  margin-bottom: 20px;
}

.construction-text h1 span {
  color: #d4a017;
}

.construction-text p {
  color: #e7e7e7;
  font-size: 20px;
  line-height: 1.8;
  max-width: 700px;
  margin: auto;
}

@media (max-width: 768px) {

  .construction-text h1 {
    font-size: 42px;
  }

  .construction-text p {
    font-size: 17px;
    padding: 0 20px;
  }

}

</style>

</head>

<body>

  <div class="construction-text">

    <h1>
      Site <span>Under Construction</span>
    </h1>

    <p>
      We are currently rebuilding this experience to better serve
      future military and civilian leaders.
      Please check back soon.
    </p>

  </div>

</body>

</html>
